<span class="header-brand">📊 OpenMetrics</span>
<span class="header-sep">│</span>
<span class="header-stat">Host: <span>{{ hostname }}</span></span>
<span class="header-sep">│</span>
<span class="header-stat">Uptime: <span>{{ uptime }}</span></span>
<span class="header-sep">│</span>
<span class="header-stat">Load: <span>{{ load }}</span></span>

    <a href="/logout" class="btn-logout">logout</a>
</div>
