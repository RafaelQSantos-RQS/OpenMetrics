<div class="card-header">
    <h2>🌐 NETWORK</h2>
</div>
<div class="network-compact">
    <div class="net-row">
        <span class="net-label">↓ Received</span>
        <span class="net-value green">{{ rx }}</span>
    </div>
    <div class="net-row">
        <span class="net-label">↑ Sent</span>
        <span class="net-value purple">{{ tx }}</span>
    </div>
    <div class="net-row">
        <span class="net-label">Packets In</span>
        <span class="net-value">{{ packets_rx }}</span>
    </div>
    <div class="net-row">
        <span class="net-label">Packets Out</span>
        <span class="net-value">{{ packets_tx }}</span>
    </div>
</div>
