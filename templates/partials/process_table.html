<div class="panel-hdr">
    <span class="lbl"><span class="dot"></span>PROCESSES</span>
    <span style="color:var(--text-dim);font-size:9px;">{{ count }} total</span>
</div>
<div class="panel-body" style="padding:0;overflow-y:auto;">
    <table class="proc-table">
        <thead>
            <tr>
                <th>PID</th>
                <th>USER</th>
                <th>NAME</th>
                <th>CPU%</th>
                <th>MEM%</th>
                <th>THR</th>
                <th>PR</th>
                <th>TIME</th>
                <th>ST</th>
            </tr>
        </thead>
        <tbody>
            {% for p in processes %}
            <tr>
                <td class="pid">{{ p.pid }}</td>
                <td>{{ p.user }}</td>
                <td class="name">{{ p.name }}</td>
                <td class="{% if p.cpu > 50.0 %}cpu-hi{% else if p.cpu > 20.0 %}cpu-md{% else %}cpu-lo{% endif %}">{{ p.cpu_display }}</td>
                <td>{{ p.mem_display }}</td>
                <td>{{ p.threads }}</td>
                <td>{{ p.priority }}</td>
                <td>{{ p.start_time }}</td>
                <td><span class="st {{ p.status_class }}">{{ p.status_short }}</span></td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
